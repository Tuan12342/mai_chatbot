<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a62e50">
  <title>Mai · OA Cosmetics</title>
  <style>
    :root { --brand:#a62e50; --brand-dark:#84203e; --page:#f2e4e5; --border:#eadadd; --text:#31272a; --muted:#85777b; }
    * { box-sizing:border-box; }
    html,body { height:100%; }
    body { margin:0; padding:5px 26px 5px 7px; background:var(--page); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    button,textarea,select { font:inherit; }
    .chat { position:relative; width:100%; height:100%; min-height:520px; display:grid; grid-template-rows:auto 1fr auto; overflow:hidden; border-radius:0 28px 28px 0; background:rgba(255,250,250,.96); box-shadow:0 18px 50px rgba(96,35,53,.08); }
    .chat::before { content:""; position:absolute; inset:0 auto 0 0; width:7px; background:linear-gradient(#b13d60,#84203e); }
    .header { min-height:88px; padding:20px 30px 18px 35px; display:flex; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid var(--border); }
    .agent { display:flex; align-items:center; gap:13px; }
    .avatar { width:46px; height:46px; display:grid; place-items:center; flex:0 0 auto; border:1px solid #e8b8c7; border-radius:15px; background:linear-gradient(145deg,#f7dce4,#efcbd6); color:#79233d; font:21px Georgia,serif; }
    .agent h1 { margin:0 0 3px; font-size:16px; }
    .agent p { margin:0; color:var(--muted); font-size:12px; }
    .status { padding:7px 12px; border:1px solid var(--border); border-radius:999px; background:rgba(255,255,255,.75); color:var(--muted); font-size:11px; }
    .status.handoff { border-color:#e5c37d; background:#fff6df; color:#7a5518; }
    .header-actions { display:flex; align-items:center; gap:8px; }
    .session-select { max-width:210px; padding:7px 10px; border:1px solid var(--border); border-radius:12px; outline:0; background:#fff; color:var(--text); font-size:11px; }
    .new-session { width:31px; height:31px; border:1px solid var(--border); border-radius:10px; background:#fff; color:var(--brand); cursor:pointer; font-size:18px; line-height:1; }
    .new-session:hover { background:#fff3f6; }
    .messages { min-height:0; padding:25px 29px 18px 34px; overflow-y:auto; scroll-behavior:smooth; }
    .message { display:flex; margin-bottom:16px; animation:appear 180ms ease both; }
    .message.user { justify-content:flex-end; }
    .bubble { max-width:min(70%,650px); padding:12px 15px; border-radius:17px; white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px; line-height:1.55; }
    .message.assistant .bubble { border:1px solid var(--border); border-bottom-left-radius:5px; background:#fff; box-shadow:0 8px 25px rgba(77,41,51,.045); }
    .message.user .bubble { border-bottom-right-radius:5px; background:var(--brand); color:#fff; }
    .payment-card { width:min(100%,420px); margin:0 0 18px; padding:20px; border:1px solid #e5c8d1; border-radius:20px; background:#fff; box-shadow:0 12px 30px rgba(77,41,51,.07); }
    .payment-title { margin:0 0 4px; color:var(--brand-dark); font-size:16px; }
    .payment-subtitle { margin:0 0 16px; color:var(--muted); font-size:12px; }
    .payment-qr { display:block; width:min(100%,280px); aspect-ratio:1; margin:0 auto 16px; object-fit:contain; border-radius:14px; background:#fff; }
    .payment-details { display:grid; gap:9px; margin:0; }
    .payment-row { display:grid; grid-template-columns:115px 1fr; gap:10px; align-items:start; font-size:13px; }
    .payment-row dt { color:var(--muted); }
    .payment-row dd { margin:0; color:var(--text); font-weight:600; overflow-wrap:anywhere; }
    .copy-payment { width:100%; margin-top:15px; padding:10px 14px; border:1px solid #dfb6c2; border-radius:12px; background:#fff5f8; color:var(--brand-dark); cursor:pointer; font-weight:600; }
    .copy-payment:hover { background:#fbe7ed; }
    .typing-dots { display:inline-flex; gap:4px; padding:3px 0; }
    .typing-dots span { width:6px; height:6px; border-radius:50%; background:#b59da4; animation:blink 800ms infinite alternate; }
    .typing-dots span:nth-child(2) { animation-delay:150ms; }
    .typing-dots span:nth-child(3) { animation-delay:300ms; }
    .composer-area { padding:9px 24px 20px 31px; }
    .composer { display:grid; grid-template-columns:1fr auto; align-items:end; gap:10px; padding:9px 9px 9px 18px; border:1px solid var(--border); border-radius:19px; background:#fff; box-shadow:0 14px 36px rgba(82,39,51,.08); }
    textarea { width:100%; max-height:130px; resize:none; border:0; outline:0; background:transparent; color:var(--text); line-height:1.5; }
    textarea::placeholder { color:#b4a5aa; }
    .send { width:42px; height:42px; border:0; border-radius:14px; background:var(--brand); color:#fff; cursor:pointer; font-size:18px; transition:150ms ease; }
    .send:hover { background:var(--brand-dark); }
    .send:disabled { cursor:not-allowed; opacity:.45; }
    .hint { margin-top:8px; color:#9f9095; text-align:center; font-size:10px; }
    @keyframes appear { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
    @keyframes blink { from { opacity:.25; } to { opacity:1; } }
    @media (max-width:680px) {
      body { padding:0; }
      .chat { min-height:100%; border-radius:0; }
      .chat::before { display:none; }
      .header { min-height:76px; padding:14px 16px; }
      .messages { padding:19px 14px 10px; }
      .composer-area { padding:8px 11px 13px; }
      .bubble { max-width:88%; }
      .header-actions { gap:5px; }
      .session-select { max-width:105px; }
      .status { display:none; }
    }
  </style>
</head>
<body>
  <main class="chat">
    <header class="header">
      <div class="agent">
        <div class="avatar">M</div>
        <div><h1>Mai</h1><p>Trợ lý OA Cosmetics</p></div>
      </div>
      <div class="header-actions">
        <select class="session-select" id="session-select" aria-label="Chọn phiên chat"></select>
        <button class="new-session" id="new-session" type="button" title="Tạo cuộc trò chuyện mới" aria-label="Tạo cuộc trò chuyện mới">+</button>
        <span class="status" id="status">Sẵn sàng</span>
      </div>
    </header>

    <section class="messages" id="messages" aria-live="polite"></section>

    <footer class="composer-area">
      <form class="composer" id="chat-form">
        <textarea id="input" rows="1" maxlength="4000" placeholder="Nhắn tin cho Mai…" aria-label="Tin nhắn"></textarea>
        <button class="send" id="send" type="submit" aria-label="Gửi tin nhắn">↑</button>
      </form>
      <div class="hint">Enter để gửi · Shift + Enter để xuống dòng</div>
    </footer>
  </main>

  <script>
    const messages=document.querySelector("#messages");
    const form=document.querySelector("#chat-form");
    const input=document.querySelector("#input");
    const send=document.querySelector("#send");
    const status=document.querySelector("#status");
    const sessionSelect=document.querySelector("#session-select");
    const newSession=document.querySelector("#new-session");
    let busy=false;
    let activeSessionId=null;
    const renderedPaymentOrderIds=new Set();

    function scrollToBottom(){ messages.scrollTop=messages.scrollHeight; }
    function addMessage(role,content){
      if(!content)return;
      const row=document.createElement("div"); row.className=`message ${role}`;
      const bubble=document.createElement("div"); bubble.className="bubble"; bubble.textContent=content;
      row.appendChild(bubble); messages.appendChild(row); scrollToBottom();
    }
    function addTyping(){
      const row=document.createElement("div"); row.className="message assistant";
      row.innerHTML='<div class="bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div>';
      messages.appendChild(row); scrollToBottom(); return row;
    }
    function formatMoney(amount){ return new Intl.NumberFormat("vi-VN").format(amount)+" ₫"; }
    function addPaymentCard(payment){
      if(!payment||renderedPaymentOrderIds.has(payment.order_id))return;
      renderedPaymentOrderIds.add(payment.order_id);
      const row=document.createElement("div"); row.className="message assistant";
      const card=document.createElement("section"); card.className="payment-card"; card.setAttribute("aria-label",`Thanh toán đơn ${payment.order_id}`);
      const title=document.createElement("h2"); title.className="payment-title"; title.textContent="Thanh toán bằng mã QR";
      const subtitle=document.createElement("p"); subtitle.className="payment-subtitle"; subtitle.textContent=`Đơn ${payment.order_id} · Đang chờ thanh toán`;
      const qr=document.createElement("img"); qr.className="payment-qr"; qr.src=payment.qr_image_url; qr.alt=`Mã VietQR thanh toán đơn ${payment.order_id}`; qr.loading="lazy";
      const details=document.createElement("dl"); details.className="payment-details";
      [["Ngân hàng",payment.bank_id],["Số tài khoản",payment.account_number],["Chủ tài khoản",payment.account_name],["Số tiền",formatMoney(payment.amount)],["Nội dung",payment.transfer_content]].forEach(([label,value])=>{
        const line=document.createElement("div"); line.className="payment-row";
        const dt=document.createElement("dt"); dt.textContent=label;
        const dd=document.createElement("dd"); dd.textContent=value;
        line.append(dt,dd); details.appendChild(line);
      });
      const copy=document.createElement("button"); copy.type="button"; copy.className="copy-payment"; copy.textContent="Sao chép nội dung chuyển khoản";
      copy.addEventListener("click",async()=>{
        try{ await navigator.clipboard.writeText(payment.transfer_content); copy.textContent="Đã sao chép"; setTimeout(()=>{copy.textContent="Sao chép nội dung chuyển khoản";},1600); }
        catch(_){ copy.textContent="Không thể sao chép tự động"; }
      });
      card.append(title,subtitle,qr,details,copy); row.appendChild(card); messages.appendChild(row); scrollToBottom();
    }
    function resizeInput(){ input.style.height="auto"; input.style.height=`${Math.min(input.scrollHeight,130)}px`; }
    function setBusy(value){ busy=value; input.disabled=value; send.disabled=value; sessionSelect.disabled=value; newSession.disabled=value; }
    function updateStatus(data){
      const waiting=["waiting_for_human","human_active"].includes(data.handoff_status);
      status.classList.toggle("handoff",waiting);
      status.textContent=waiting?"Đang chờ người thật":data.current_step==="idle"?"Sẵn sàng":data.current_step;
    }
    async function sendMessage(text){
      const clean=text.trim(); if(!clean||busy||!activeSessionId)return;
      addMessage("user",clean); input.value=""; resizeInput(); setBusy(true);
      const typing=addTyping();
      try{
        const response=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:activeSessionId,message:clean})});
        const data=await response.json(); typing.remove();
        if(!response.ok)throw new Error(data.detail||"Không thể gửi tin nhắn.");
        if(data.reply)addMessage("assistant",data.reply); addPaymentCard(data.payment); updateStatus(data); await refreshSessions();
      }catch(error){ typing.remove(); addMessage("assistant",error.message||"Có lỗi xảy ra. Vui lòng thử lại."); }
      finally{ setBusy(false); input.focus(); }
    }
    form.addEventListener("submit",event=>{ event.preventDefault(); sendMessage(input.value); });
    input.addEventListener("input",resizeInput);
    input.addEventListener("keydown",event=>{ if(event.key==="Enter"&&!event.shiftKey){ event.preventDefault(); form.requestSubmit(); } });
    async function refreshSessions(){
      const response=await fetch("/api/sessions");
      if(!response.ok)throw new Error("Không thể tải danh sách phiên chat.");
      const sessions=await response.json();
      sessionSelect.textContent="";
      sessions.forEach(session=>{
        const option=document.createElement("option"); option.value=session.session_id; option.textContent=session.title;
        sessionSelect.appendChild(option);
      });
      if(activeSessionId)sessionSelect.value=activeSessionId;
      return sessions;
    }
    async function createSession(){
      const response=await fetch("/api/sessions",{method:"POST"});
      if(!response.ok)throw new Error("Không thể tạo phiên chat.");
      const session=await response.json(); activeSessionId=session.session_id;
      localStorage.setItem("mai_active_session_id",activeSessionId);
      await refreshSessions(); messages.textContent=""; renderedPaymentOrderIds.clear(); status.textContent="Sẵn sàng"; input.focus();
    }
    async function loadHistory(){
      if(!activeSessionId)return;
      messages.textContent=""; renderedPaymentOrderIds.clear();
      try{
        const sessionId=encodeURIComponent(activeSessionId);
        const [historyResponse,paymentResponse]=await Promise.all([fetch(`/api/history?session_id=${sessionId}`),fetch(`/api/payment?session_id=${sessionId}`)]);
        if(historyResponse.ok){ const history=await historyResponse.json(); history.forEach(message=>addMessage(message.role,message.content)); }
        if(paymentResponse.ok)addPaymentCard(await paymentResponse.json());
      }
      catch(_){ /* Không có lịch sử thì giữ vùng chat trống. */ }
    }
    newSession.addEventListener("click",()=>{ if(!busy)createSession().catch(error=>addMessage("assistant",error.message)); });
    sessionSelect.addEventListener("change",()=>{
      activeSessionId=sessionSelect.value; localStorage.setItem("mai_active_session_id",activeSessionId); loadHistory();
    });
    async function initialize(){
      try{
        let sessions=await refreshSessions();
        if(!sessions.length){ await createSession(); return; }
        const saved=localStorage.getItem("mai_active_session_id");
        activeSessionId=sessions.some(session=>session.session_id===saved)?saved:sessions[0].session_id;
        sessionSelect.value=activeSessionId; localStorage.setItem("mai_active_session_id",activeSessionId); await loadHistory();
      }catch(error){ addMessage("assistant",error.message||"Không thể tải lịch sử trò chuyện."); }
      input.focus();
    }
    initialize();
  </script>
</body>
</html>
