[project]
name = "mai-agent-langgraph"
version = "0.1.0"
description = "Lõi chatbot Mai sử dụng LangChain và LangGraph"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "langchain-google-genai>=4.0,<5.0",
  "pydantic-settings>=2.10,<3.0",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.34,<1.0",
  "langfuse>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
mai-agent = "mai_agent.runner:main"
mai-agent-web = "mai_agent.api:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mai_agent.web" = ["*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
